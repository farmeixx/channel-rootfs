# Boot-image packing for the vendored mainline kernel (channel / SDM632).
# The kernel itself ships in ../vendor (Image.gz + DTB from the validated
# build); this conf only carries the packing contract.

KERNEL_BOOT_NAME="boot-channel.img"
KERNEL_CMDLINE="console=ttyMSM0,115200n8 console=tty0 root=PARTLABEL=userdata rootfstype=ext4 rootwait rw loglevel=7 ignore_loglevel"

KERNEL_BOOT_HEADER_VERSION=0
KERNEL_BOOT_BASE="0x80000000"
KERNEL_BOOT_KERNEL_OFFSET="0x00008000"
KERNEL_BOOT_RAMDISK_OFFSET="0x01000000"
KERNEL_BOOT_SECOND_OFFSET="0x00f00000"
KERNEL_BOOT_TAGS_OFFSET="0x00000100"
KERNEL_BOOT_PAGE_SIZE=2048
