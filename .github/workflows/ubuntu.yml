# Dispatch on main; use the unified rootfs branch's ubuntu scripts and shared firmware.
# No kernel build/dispatch: the shell script fetches an existing mainline checkpoint.
name: Build ubuntu rootfs
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: channel-ubuntu-rootfs
  cancel-in-progress: true
jobs:
  rootfs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rootfs
      - name: Reuse kernel checkpoint and build ubuntu via shell
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash sh/build.sh ubuntu
      - uses: actions/upload-artifact@v4
        with:
          name: channel-ubuntu-rootfs
          path: |
            out/rootfs/ubuntu/ubuntu-channel-rootfs.ext4.zst
            out/rootfs/ubuntu/build-info.txt
            out/rootfs/ubuntu/SHA256SUMS.ubuntu
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: boot.img
          path: out/rootfs/ubuntu/boot.img
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: rootfs.ext4
          path: out/rootfs/ubuntu/rootfs.ext4
          if-no-files-found: error
          retention-days: 14
