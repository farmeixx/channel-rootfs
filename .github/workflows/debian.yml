# UI registration only. The real debian build is in the debian branch.
# GitHub requires workflow_dispatch YAML on the default branch.
name: Build debian rootfs
on:
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: 'Optional existing mainline kernel run ID'
        required: false
        type: string
permissions:
  contents: read
jobs:
  wrong-branch:
    runs-on: ubuntu-24.04
    steps:
      - name: Select the debian branch
        run: |
          echo "::error::Use Run workflow > Branch: debian. The main branch is kernel-only."
          exit 1
