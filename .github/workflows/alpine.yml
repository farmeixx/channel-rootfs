name: Build alpine rootfs
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: channel-alpine-rootfs
  cancel-in-progress: true
jobs:
  rootfs:
    if: github.ref == 'refs/heads/alpine'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: Reuse kernel checkpoint and build alpine via shell
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash scripts/ci/build-rootfs.sh alpine
      - uses: actions/upload-artifact@v4
        with:
          name: channel-alpine-rootfs
          path: |
            out/rootfs/alpine/alpine-channel-rootfs.ext4.zst
            out/rootfs/alpine/build-info.txt
            out/rootfs/alpine/SHA256SUMS.alpine
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: boot.img
          path: out/rootfs/alpine/boot.img
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: rootfs.ext4
          path: out/rootfs/alpine/rootfs.ext4
          if-no-files-found: error
          retention-days: 14
