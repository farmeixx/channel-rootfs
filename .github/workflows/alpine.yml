# UI registration only. The real alpine build is in the alpine branch.
# GitHub requires workflow_dispatch YAML on the default branch.
name: Build alpine rootfs
on:
  workflow_dispatch:
    inputs:
      kernel_run_id:
        description: 'Optional existing mainline kernel run ID'
        required: false
        type: string
permissions:
  contents: read
jobs:
  wrong-branch:
    runs-on: ubuntu-24.04
    steps:
      - name: Select the alpine branch
        run: |
          echo "::error::Use Run workflow > Branch: alpine. The main branch is kernel-only."
          exit 1
