# Dispatch on main; use the unified rootfs branch's alpine scripts and shared firmware.
# No kernel build/dispatch: the shell script fetches an existing mainline checkpoint.
name: Build alpine rootfs
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: channel-alpine-rootfs
  cancel-in-progress: true
jobs:
  rootfs:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          ref: rootfs
      - name: Reuse kernel checkpoint and build alpine via shell
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash sh/build.sh alpine
      - uses: actions/upload-artifact@v4
        with:
          name: channel-alpine-rootfs
          path: build/rootfs/alpine/
          if-no-files-found: error
          retention-days: 14
