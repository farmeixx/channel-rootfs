name: Build mainline kernel
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: channel-mainline-kernel
  cancel-in-progress: false
jobs:
  kernel:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - name: Build and validate the reusable kernel checkpoint
        run: bash mainline/run.sh
      - name: Identify kernel revision
        id: source
        shell: bash
        run: echo "sha=$(cat out/kernel/checkpoint/kernel-git-revision.txt)" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: channel-mainline-kernel-${{ steps.source.outputs.sha }}
          path: out/kernel/checkpoint/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: boot.img
          path: out/kernel/images/boot.img
          if-no-files-found: error
          retention-days: 90
