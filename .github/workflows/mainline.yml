name: Build mainline kernel
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: channel-mainline-kernel
  cancel-in-progress: false
jobs:
  kernel:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    env:
      CCACHE_MAXSIZE: 2G
      CCACHE_COMPRESS: "true"
    steps:
      - uses: actions/checkout@v4
      - name: Restore ARM64 compiler cache
        uses: actions/cache@v4
        with:
          path: cache/mainline/ccache
          key: channel-arm64-ccache-${{ runner.os }}-${{ runner.arch }}-${{ github.run_id }}
          restore-keys: |
            channel-arm64-ccache-${{ runner.os }}-${{ runner.arch }}-
      - name: Build the kernel checkpoint
        run: bash sh/run.sh
      - name: Identify kernel revision
        id: source
        shell: bash
        run: |
          sha="$(sed -n 's/^kernel_source_sha=//p' cache/mainline/checkpoint/source-report.txt)"
          echo "sha=$sha" >> "$GITHUB_OUTPUT"
      - uses: actions/upload-artifact@v4
        with:
          name: channel-mainline-kernel-${{ steps.source.outputs.sha }}
          path: cache/mainline/checkpoint/
          if-no-files-found: error
          retention-days: 90
      - uses: actions/upload-artifact@v4
        with:
          name: boot.img
          path: cache/mainline/checkpoint/boot-channel.img
          if-no-files-found: error
          retention-days: 90
